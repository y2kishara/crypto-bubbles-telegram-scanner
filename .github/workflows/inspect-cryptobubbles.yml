name: Inspect Crypto Bubbles Data

on:
  workflow_dispatch:

jobs:
  inspect-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Inspect Crypto Bubbles page and data requests
        run: |
          cat > inspect.js <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });

            const requests = [];
            page.on('request', request => {
              const url = request.url();
              if (/api|graphql|coin|market|bubble|ticker|price|data/i.test(url)) {
                requests.push({ method: request.method(), url });
              }
            });

            page.on('response', async response => {
              const url = response.url();
              const contentType = response.headers()['content-type'] || '';
              if (/api|graphql|coin|market|bubble|ticker|price|data/i.test(url) &&
                  (contentType.includes('json') || contentType.includes('text'))) {
                try {
                  const body = await response.text();
                  console.log('DATA_RESPONSE', JSON.stringify({
                    status: response.status(),
                    url,
                    contentType,
                    sample: body.slice(0, 1200)
                  }));
                } catch (e) {}
              }
            });

            try {
              await page.goto('https://cryptobubbles.net/en', {
                waitUntil: 'domcontentloaded',
                timeout: 60000
              });
              await page.waitForTimeout(15000);

              console.log('PAGE_TITLE', await page.title());
              console.log('PAGE_URL', page.url());
              console.log('VISIBLE_TEXT', (await page.locator('body').innerText()).slice(0, 6000));

              const controls = await page.locator('button, [role="button"], select, option')
                .evaluateAll(nodes => nodes.map(n => ({
                  tag: n.tagName,
                  text: (n.innerText || n.textContent || '').trim().slice(0, 100),
                  aria: n.getAttribute('aria-label'),
                  title: n.getAttribute('title')
                })).filter(x => x.text || x.aria || x.title).slice(0, 150));

              console.log('CONTROLS', JSON.stringify(controls, null, 2));
              console.log('MATCHING_REQUESTS', JSON.stringify(requests, null, 2));
            } catch (e) {
              console.log('INSPECTION_ERROR', e.stack || String(e));
            } finally {
              await browser.close();
            }
          })();
          EOF

          node inspect.js
