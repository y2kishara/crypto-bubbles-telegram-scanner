name: Inspect Visible Crypto Bubbles

on:
  workflow_dispatch:

jobs:
  inspect-visible-bubbles:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Inspect actual visible heatmap bubbles
        run: |
          cat > visible.js <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const report = {};
            try {
              await page.goto('https://cryptobubbles.net/en', { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForTimeout(20000);

              report.title = await page.title();
              report.viewport = await page.evaluate(() => ({ width: innerWidth, height: innerHeight, dpr: devicePixelRatio }));
              report.bodyText = (await page.locator('body').innerText()).slice(0, 3000);

              report.canvases = await page.locator('canvas').evaluateAll(nodes => nodes.map((n,i) => {
                const r=n.getBoundingClientRect();
                return {i,width:n.width,height:n.height,rect:{x:r.x,y:r.y,width:r.width,height:r.height},visible:r.width>0&&r.height>0};
              }));

              report.svgs = await page.locator('svg').evaluateAll(nodes => nodes.slice(0,30).map((n,i) => {
                const r=n.getBoundingClientRect();
                return {i,rect:{x:r.x,y:r.y,width:r.width,height:r.height},text:(n.innerText||'').slice(0,300),class:n.getAttribute('class')};
              }));

              report.visibleElements = await page.locator('body *').evaluateAll(nodes => nodes.map(n => {
                const r=n.getBoundingClientRect(), s=getComputedStyle(n);
                if (!r.width || !r.height || r.bottom<=0 || r.right<=0 || r.top>=innerHeight || r.left>=innerWidth) return null;
                const text=(n.innerText||n.getAttribute('aria-label')||n.getAttribute('title')||'').trim().replace(/\\s+/g,' ');
                const cls=typeof n.className==='string'?n.className:(n.getAttribute('class')||'');
                if (!text && !/bubble|coin|crypto|circle/i.test(cls+' '+n.tagName)) return null;
                return {tag:n.tagName,cls:cls.slice(0,160),text:text.slice(0,180),aria:n.getAttribute('aria-label'),title:n.getAttribute('title'),data:[...n.attributes].filter(a=>a.name.startsWith('data-')).slice(0,12).map(a=>[a.name,a.value]),rect:{x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)},display:s.display,visibility:s.visibility};
              }).filter(Boolean).slice(0,250));

              report.coinLikeLinks = await page.locator('a').evaluateAll(nodes => nodes.map(n => ({text:(n.innerText||'').trim(),href:n.href,aria:n.getAttribute('aria-label'),title:n.title})).filter(x => x.text || x.aria || x.title).slice(0,100));

              const out='# Visible Crypto Bubbles inspection\\n\\n'+
                '## Page / viewport\\n~~~json\\n'+JSON.stringify({title:report.title,viewport:report.viewport},null,2)+'\\n~~~\\n\\n'+
                '## Canvas elements\\n~~~json\\n'+JSON.stringify(report.canvases,null,2)+'\\n~~~\\n\\n'+
                '## SVG elements\\n~~~json\\n'+JSON.stringify(report.svgs,null,2)+'\\n~~~\\n\\n'+
                '## Visible bubble/coin-like elements\\n~~~json\\n'+JSON.stringify(report.visibleElements,null,2)+'\\n~~~\\n\\n'+
                '## Links\\n~~~json\\n'+JSON.stringify(report.coinLikeLinks,null,2)+'\\n~~~\\n\\n'+
                '## Visible text\\n~~~text\\n'+report.bodyText+'\\n~~~\\n';
              require('fs').writeFileSync('visible-bubbles-report.md',out);
              require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY,out);
              console.log('Visible bubble inspection complete. Open Summary.');
            } catch(e) { console.error(e.stack||String(e)); process.exitCode=1; }
            finally { await browser.close(); }
          })();
          EOF
          node visible.js

      - name: Upload visible bubble report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visible-bubbles-report
          path: visible-bubbles-report.md
          if-no-files-found: ignore
