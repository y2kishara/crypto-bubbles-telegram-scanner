name: Inspect Crypto Bubbles Data

on:
  workflow_dispatch:

jobs:
  inspect-site:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Inspect Crypto Bubbles page and data requests
        run: |
          cat > inspect.js <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const requests = [];
            const jsonResponses = [];

            page.on('request', request => {
              if (['xhr', 'fetch'].includes(request.resourceType())) {
                requests.push({
                  method: request.method(),
                  type: request.resourceType(),
                  url: request.url().slice(0, 500)
                });
              }
            });

            page.on('response', async response => {
              const contentType = response.headers()['content-type'] || '';
              if (contentType.includes('application/json')) {
                try {
                  const body = await response.text();
                  jsonResponses.push({
                    status: response.status(),
                    url: response.url().slice(0, 500),
                    sample: body.slice(0, 1800)
                  });
                } catch (e) {
                  jsonResponses.push({ url: response.url(), error: String(e) });
                }
              }
            });

            try {
              await page.goto('https://cryptobubbles.net/en', {
                waitUntil: 'domcontentloaded',
                timeout: 60000
              });
              await page.waitForTimeout(18000);

              console.log('=== PAGE ===');
              console.log('PAGE_TITLE:', await page.title());
              console.log('PAGE_URL:', page.url());
              console.log('VISIBLE_TEXT:', (await page.locator('body').innerText()).slice(0, 3500));

              const controls = await page.locator('button, [role="button"], select, option')
                .evaluateAll(nodes => nodes.map(n => ({
                  tag: n.tagName,
                  text: (n.innerText || n.textContent || '').trim().slice(0, 80),
                  aria: n.getAttribute('aria-label'),
                  title: n.getAttribute('title')
                })).filter(x => x.text || x.aria || x.title).slice(0, 100));

              console.log('=== TIMEFRAME / PAGE CONTROLS ===');
              console.log(JSON.stringify(controls, null, 2));
              console.log('=== XHR / FETCH REQUESTS ===');
              console.log(JSON.stringify(requests, null, 2));
              console.log('=== JSON RESPONSES ONLY ===');
              console.log(JSON.stringify(jsonResponses, null, 2));
            } catch (e) {
              console.log('INSPECTION_ERROR:', e.stack || String(e));
              process.exitCode = 1;
            } finally {
              await browser.close();
            }
          })();
          EOF

          node inspect.js
