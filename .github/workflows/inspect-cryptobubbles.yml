name: Inspect Visible Crypto Bubbles

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-cryptobubbles.yml'

jobs:
  inspect-visible-bubbles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Capture actual 5m heatmap bubble labels
        run: |
          cat > visible.js <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('node:fs');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 1440, height: 900 },
              deviceScaleFactor: 1
            });
            const canvasText = [];

            // Record text painted into 2D canvases; bubble labels may not exist in the DOM.
            await page.addInitScript(() => {
              const ids = new WeakMap();
              let nextId = 1;
              const idFor = canvas => {
                if (!ids.has(canvas)) ids.set(canvas, nextId++);
                return ids.get(canvas);
              };
              const originalText = CanvasRenderingContext2D.prototype.fillText;
              CanvasRenderingContext2D.prototype.fillText = function(text, x, y, ...rest) {
                try {
                  const canvas = this.canvas;
                  window.__bubbleCanvasText = window.__bubbleCanvasText || [];
                  window.__bubbleCanvasText.push({
                    canvasId: idFor(canvas), text: String(text), font: this.font,
                    fillStyle: String(this.fillStyle), canvasWidth: canvas.width, canvasHeight: canvas.height
                  });
                } catch (_) {}
                return originalText.call(this, text, x, y, ...rest);
              };
              const originalImage = CanvasRenderingContext2D.prototype.drawImage;
              CanvasRenderingContext2D.prototype.drawImage = function(source, ...args) {
                try {
                  if (source instanceof HTMLCanvasElement) {
                    let dx, dy, dw, dh;
                    if (args.length === 2) {
                      [dx, dy] = args; dw = source.width; dh = source.height;
                    } else if (args.length === 4) {
                      [dx, dy, dw, dh] = args;
                    } else if (args.length === 8) {
                      [,,,, dx, dy, dw, dh] = args;
                    }
                    window.__bubbleDrawImages = window.__bubbleDrawImages || [];
                    window.__bubbleDrawImages.push({
                      sourceCanvasId: idFor(source), targetCanvasId: idFor(this.canvas),
                      dx, dy, dw, dh, targetWidth: this.canvas.width, targetHeight: this.canvas.height
                    });
                  }
                } catch (_) {}
                return originalImage.call(this, source, ...args);
              };
            });

            try {
              await page.goto('https://cryptobubbles.net/en', {
                waitUntil: 'domcontentloaded',
                timeout: 60000
              });
              await page.waitForTimeout(20000);

              // Open Edit chart, then inspect the Period selection control.
              const editChart = page.locator('button[title="Edit chart"]');
              if (await editChart.count()) {
                await editChart.first().click().catch(() => {});
                await page.waitForTimeout(1500);
              }

              const controlsBefore = await page.evaluate(() =>
                [...document.querySelectorAll('button,[role="button"],[role="tab"],select,[role="menuitem"],[role="option"]')]
                  .map((e, i) => {
                    const r = e.getBoundingClientRect();
                    const style = getComputedStyle(e);
                    return {
                      index: i, tag: e.tagName,
                      text: (e.innerText || e.getAttribute('aria-label') || e.getAttribute('title') || '').trim(),
                      ariaLabel: e.getAttribute('aria-label'),
                      title: e.getAttribute('title'),
                      role: e.getAttribute('role'),
                      className: String(e.className || ''),
                      visible: r.width > 0 && r.height > 0 && style.visibility !== 'hidden' && style.display !== 'none',
                      rect: { x: Math.round(r.x), y: Math.round(r.y),
                        width: Math.round(r.width), height: Math.round(r.height) },
                      html: e.outerHTML.slice(0, 700)
                    };
                  })
              );

              // The period selector is the chart configuration dropdown (not the coin range selector).
              const periodSelector = page.locator('button.configuration-select').first();
              let periodMenuOpened = false;
              if (await periodSelector.count()) {
                await periodSelector.click({ force: true }).catch(() => {});
                periodMenuOpened = true;
                await page.waitForTimeout(1000);
              }

              const periodOptions = await page.locator('button.select-option').allInnerTexts();

              // Select the exact visible Period option; it is a button labelled "5 Min".
              let fiveMClicked = false;
              const fiveM = page.getByRole('button', { name: '5 Min', exact: true });
              const fiveMCount = await fiveM.count();
              if (fiveMCount > 0 && await fiveM.first().isVisible()) {
                await fiveM.first().click();
                await page.waitForTimeout(2000);
                const activeOptions = await page.locator('button.select-option.active').allInnerTexts();
                fiveMClicked = activeOptions.some(t => t.trim() === '5 Min');
              }
              if (fiveMClicked) {\n                await page.waitForTimeout(2500);\n                await page.locator('button[title="Close window"]').click().catch(() => {});\n                await page.waitForTimeout(7000);\n              }

              const report = await page.evaluate(({ controls, clicked, periodMenuOpened, periodOptions }) => ({
                title: document.title,
                viewport: { width: innerWidth, height: innerHeight, dpr: devicePixelRatio },
                fiveMClicked: clicked,
                periodMenuOpened: periodMenuOpened,
                controls,
                periodOptions: periodOptions,
                bodyText: (document.body.innerText || '').slice(0, 5000),
                canvases: [...document.querySelectorAll('canvas')].map((c, i) => {
                  const r = c.getBoundingClientRect();
                  return {
                    index: i, width: c.width, height: c.height,
                    rect: { x: Math.round(r.x), y: Math.round(r.y),
                      width: Math.round(r.width), height: Math.round(r.height) },
                    visible: r.width > 0 && r.height > 0
                  };
                }),
                canvasText: window.__bubbleCanvasText || [],\n                canvasDrawImages: window.__bubbleDrawImages || [],\n                activePeriodOptions: [...document.querySelectorAll('button.select-option.active')].map(e => (e.innerText||'').trim())
              }), { controls: controlsBefore, clicked: fiveMClicked, periodMenuOpened });

              // Save the rendered page and each visible canvas for direct visual verification.
              await page.screenshot({ path: 'heatmap-page.png', fullPage: false });
              const canvases = page.locator('canvas');
              for (let i = 0; i < await canvases.count(); i++) {
                const c = canvases.nth(i);
                const b = await c.boundingBox();
                if (b && b.width > 0 && b.height > 0) {
                  await c.screenshot({ path: `heatmap-canvas-${i}.png` }).catch(() => {});
                }
              }

              fs.writeFileSync('visible-bubbles-report.json', JSON.stringify(report, null, 2));
              const summary = [
                '# 5m Visible Crypto Bubbles inspection',
                '',
                '## Page and viewport',
                '```json',
                JSON.stringify({ title: report.title, viewport: report.viewport, canvases: report.canvases }, null, 2),
                '```',
                '',
                '## Visible page text',
                '```text',
                report.bodyText,
                '```',
                '',
                '## Text drawn into canvas (candidate bubble labels)',
                '```json',
                JSON.stringify(report.canvasText, null, 2),
                '```'
              ].join('\n');
              fs.writeFileSync('visible-bubbles-report.md', summary);
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
              console.log('5m heatmap capture complete. Canvas text calls:', report.canvasText.length);
            } catch (error) {
              console.error(error.stack || String(error));
              process.exitCode = 1;
            } finally {
              await browser.close();
            }
          })();
          EOF
          node visible.js

      - name: Upload heatmap inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visible-bubbles-5m-inspection
          path: |
            visible-bubbles-report.json
            visible-bubbles-report.md
            heatmap-page.png
            heatmap-canvas-*.png
          if-no-files-found: ignore
