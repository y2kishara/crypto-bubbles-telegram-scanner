name: Inspect Crypto Bubbles Data

on:
  workflow_dispatch:

jobs:
  inspect-site:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Inspect Crypto Bubbles page and market data
        run: |
          cat > inspect.js <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const requests = [];
            const jsonResponses = [];
            const sockets = [];
            const socketFrames = [];
            let bubbleStats = null;

            page.on('request', request => {
              if (['xhr', 'fetch'].includes(request.resourceType())) {
                requests.push({
                  method: request.method(),
                  type: request.resourceType(),
                  url: request.url().slice(0, 400)
                });
              }
            });

            page.on('websocket', ws => {
              sockets.push(ws.url().slice(0, 400));
              ws.on('framereceived', event => {
                const payload = typeof event.payload === 'string' ? event.payload : '[binary frame]';
                socketFrames.push({ url: ws.url().slice(0, 250), sample: payload.slice(0, 800) });
              });
            });

            page.on('response', async response => {
              const contentType = response.headers()['content-type'] || '';
              if (!contentType.includes('application/json')) return;
              try {
                const body = await response.text();
                jsonResponses.push({
                  status: response.status(),
                  url: response.url().slice(0, 400),
                  sample: body.slice(0, 1000)
                });

                if (response.url().includes('/backend/data/bubbles')) {
                  const coins = JSON.parse(body);
                  const min5Present = coins.filter(c => Number.isFinite(c.performance?.min5)).length;
                  bubbleStats = {
                    endpoint: response.url(),
                    totalCoins: coins.length,
                    min5Present,
                    min5Missing: coins.length - min5Present,
                    sampleCoins: coins.slice(0, 12).map(c => ({
                      name: c.name,
                      symbol: c.symbol,
                      rank: c.rank,
                      price: c.price,
                      min5: c.performance?.min5,
                      day: c.performance?.day,
                      volume: c.volume
                    }))
                  };
                }
              } catch (e) {}
            });

            try {
              await page.goto('https://cryptobubbles.net/en', {
                waitUntil: 'domcontentloaded',
                timeout: 60000
              });
              await page.waitForTimeout(18000);

              const title = await page.title();
              const visibleText = (await page.locator('body').innerText()).slice(0, 1800);
              const controls = await page.locator('button, [role="button"], select, option')
                .evaluateAll(nodes => nodes.map(n => ({
                  tag: n.tagName,
                  text: (n.innerText || n.textContent || '').trim().slice(0, 80),
                  aria: n.getAttribute('aria-label'),
                  title: n.getAttribute('title')
                })).filter(x => x.text || x.aria || x.title).slice(0, 80));

              const summary = [
                '# Crypto Bubbles inspection results',
                '',
                '## Page',
                '- Title: ' + title,
                '- URL: ' + page.url(),
                '',
                '## Visible page text',
                '~~~text',
                visibleText,
                '~~~',
                '',
                '## Page controls',
                '~~~json',
                JSON.stringify(controls, null, 2),
                '~~~',
                '',
                '## Market data endpoint validation',
                '~~~json',
                JSON.stringify(bubbleStats, null, 2),
                '~~~',
                '',
                '## XHR / Fetch requests',
                '~~~json',
                JSON.stringify(requests, null, 2),
                '~~~',
                '',
                '## WebSocket connections',
                '~~~json',
                JSON.stringify(sockets, null, 2),
                '~~~',
                '',
                '## JSON response samples',
                '~~~json',
                JSON.stringify(jsonResponses.slice(0, 12), null, 2),
                '~~~'
              ].join('\n');

              require('fs').writeFileSync('inspection-summary.md', summary);
              require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\n');
              console.log('Inspection complete. Open the Summary tab.');
              console.log('Bubble data stats:', JSON.stringify(bubbleStats));
            } catch (e) {
              console.log('INSPECTION_ERROR:', e.stack || String(e));
              process.exitCode = 1;
            } finally {
              await browser.close();
            }
          })();
          EOF

          node inspect.js

      - name: Save inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptobubbles-inspection-report
          path: inspection-summary.md
          if-no-files-found: ignore
