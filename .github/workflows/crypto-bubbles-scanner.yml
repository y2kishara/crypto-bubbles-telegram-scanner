name: Crypto Bubbles 5-Minute Scanner

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-bubbles-scanner
  cancel-in-progress: false

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out scanner and previous scan state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch 5-minute market data and send Telegram report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scanner.js

      - name: Save previous scan state for the next run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/previous-scan.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update previous market scan state"
            git push
          fi
